<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#f4d03f"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a0c0"/>
      <stop offset="0.5" stop-color="#d47394"/>
      <stop offset="1" stop-color="#b8477a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f5e6c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="280" fill="url(#glow)"/>

  <!-- Elegant decorative border -->
  <circle cx="320" cy="320" r="300" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <circle cx="320" cy="320" r="290" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>

  <!-- Scissors icon - central element -->
  <g transform="translate(320 280)" filter="url(#shadow)">
    <!-- Top blade -->
    <path d="M-60 -10 L60 -80 L70 -75 L-50 -5 Z" fill="url(#gold)"/>
    <!-- Bottom blade -->
    <path d="M-60 10 L60 80 L70 75 L-50 5 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Screw/pivot -->
    <circle cx="0" cy="0" r="18" fill="url(#cream)"/>
    <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="4" fill="#1a1a2e"/>
    <!-- Handle loops -->
    <ellipse cx="-45" cy="-25" rx="22" ry="28" fill="none" stroke="url(#rose)" stroke-width="6"/>
    <ellipse cx="-45" cy="25" rx="22" ry="28" fill="none" stroke="url(#rose)" stroke-width="6"/>
  </g>

  <!-- Decorative hair strand/stylized flourish -->
  <g opacity="0.6">
    <path d="M200 420 Q240 380 280 400 Q320 420 360 390 Q400 360 440 380" 
          fill="none" stroke="url(#rose)" stroke-width="3" stroke-linecap="round"/>
    <path d="M180 440 Q230 400 270 420 Q310 440 350 410 Q390 380 430 400" 
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sparkle accents -->
  <g fill="url(#gold)">
    <circle cx="180" cy="180" r="3"/>
    <circle cx="460" cy="200" r="2.5"/>
    <circle cx="500" cy="420" r="2"/>
    <circle cx="160" cy="380" r="2"/>
  </g>

  <!-- Title -->
  <text x="320" y="480" text-anchor="middle" 
        font-family="Georgia, serif" font-size="32" font-weight="bold" 
        fill="url(#cream)" letter-spacing="8">SCISSORS</text>
  
  <!-- Subtitle -->
  <text x="320" y="510" text-anchor="middle" 
        font-family="Georgia, serif" font-size="14" font-weight="normal" 
        fill="url(#gold)" letter-spacing="4" opacity="0.8">LUXURY SALON</text>

  <!-- Decorative line -->
  <line x1="220" y1="530" x2="420" y2="530" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <circle cx="220" cy="530" r="2" fill="url(#gold)"/>
  <circle cx="420" cy="530" r="2" fill="url(#gold)"/>
</svg>
