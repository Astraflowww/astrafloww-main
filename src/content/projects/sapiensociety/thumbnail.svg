<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <!-- Browser window: Hero / About / Network -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="74" y="94" width="420" height="356" rx="16" fill="var(--color-neutral, #9ca3af)" opacity="0.3" transform="rotate(-1 284 272)"/>
    <rect x="70" y="90" width="420" height="356" rx="16" fill="var(--color-base-100, #ffffff)" stroke="var(--color-base-content, #1f2937)" stroke-width="4"/>

    <!-- Title bar -->
    <path d="M70 134 H490" stroke="var(--color-base-content, #1f2937)" stroke-width="3" opacity="0.6"/>
    <circle cx="96" cy="112" r="6" fill="var(--color-error, #ef4444)"/>
    <circle cx="116" cy="112" r="6" fill="var(--color-warning, #f59e0b)"/>
    <circle cx="136" cy="112" r="6" fill="var(--color-success, #22c55e)"/>
    <rect x="170" y="100" width="260" height="24" rx="12" fill="var(--color-neutral, #9ca3af)" opacity="0.3"/>
    <text x="300" y="117" font-family="Excalifont, sans-serif" font-size="13" fill="var(--color-base-content, #1f2937)" text-anchor="middle">sapiensociety.in</text>

    <!-- Hero -->
    <rect x="90" y="150" width="380" height="110" rx="10" fill="var(--color-primary, #7C6DF6)" opacity="0.15"/>
    <rect x="90" y="150" width="380" height="110" rx="10" fill="none" stroke="var(--color-primary, #7C6DF6)" stroke-width="2.5"/>
    <text x="108" y="172" font-family="Excalifont, sans-serif" font-size="11" font-weight="bold" fill="var(--color-primary, #7C6DF6)" letter-spacing="2">HERO</text>
    <rect x="108" y="184" width="190" height="14" rx="7" fill="var(--color-base-content, #1f2937)" opacity="0.8"/>
    <rect x="108" y="206" width="140" height="12" rx="6" fill="var(--color-base-content, #1f2937)" opacity="0.4"/>
    <rect x="108" y="228" width="96" height="24" rx="12" fill="var(--color-primary, #7C6DF6)"/>
    <text x="156" y="245" font-family="Excalifont, sans-serif" font-size="12" font-weight="bold" fill="var(--color-primary-content, #ffffff)" text-anchor="middle">Explore</text>
    <circle cx="400" cy="208" r="36" fill="var(--color-secondary, #ec4899)" opacity="0.25"/>
    <circle cx="400" cy="208" r="36" fill="none" stroke="var(--color-secondary, #ec4899)" stroke-width="2.5" stroke-dasharray="5 5"/>
    <circle cx="400" cy="208" r="15" fill="var(--color-secondary, #ec4899)"/>

    <!-- About -->
    <rect x="90" y="274" width="380" height="88" rx="10" fill="var(--color-accent, #14b8a6)" opacity="0.15"/>
    <rect x="90" y="274" width="380" height="88" rx="10" fill="none" stroke="var(--color-accent, #14b8a6)" stroke-width="2.5"/>
    <text x="108" y="294" font-family="Excalifont, sans-serif" font-size="11" font-weight="bold" fill="var(--color-accent, #14b8a6)" letter-spacing="2">ABOUT</text>
    <circle cx="134" cy="332" r="20" fill="var(--color-neutral, #9ca3af)" opacity="0.4"/>
    <circle cx="134" cy="332" r="20" fill="none" stroke="var(--color-base-content, #1f2937)" stroke-width="2.5"/>
    <circle cx="134" cy="326" r="7" fill="var(--color-base-content, #1f2937)"/>
    <path d="M123 344 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/>
    <rect x="176" y="306" width="270" height="10" rx="5" fill="var(--color-base-content, #1f2937)" opacity="0.5"/>
    <rect x="176" y="324" width="220" height="10" rx="5" fill="var(--color-base-content, #1f2937)" opacity="0.35"/>
    <rect x="176" y="342" width="245" height="10" rx="5" fill="var(--color-base-content, #1f2937)" opacity="0.35"/>

