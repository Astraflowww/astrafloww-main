    <rect x="90" y="376" width="380" height="56" rx="10" fill="var(--color-success, #22c55e)" opacity="0.15"/>
    <rect x="90" y="376" width="380" height="56" rx="10" fill="none" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
    <text x="108" y="409" font-family="Excalifont, sans-serif" font-size="11" font-weight="bold" fill="var(--color-success, #22c55e)" letter-spacing="2">NETWORK</text>
    <path d="M222 404 H438" stroke="var(--color-success, #22c55e)" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle cx="222" cy="404" r="9" fill="var(--color-base-100, #ffffff)" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
    <circle cx="276" cy="404" r="9" fill="var(--color-base-100, #ffffff)" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
    <circle cx="330" cy="404" r="9" fill="var(--color-base-100, #ffffff)" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
    <circle cx="384" cy="404" r="9" fill="var(--color-base-100, #ffffff)" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
    <circle cx="438" cy="404" r="9" fill="var(--color-base-100, #ffffff)" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/>
  </g>

  <!-- Link arrow -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M498 280 H524" stroke="var(--color-primary, #7C6DF6)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
    <polygon points="524,272 538,280 524,288" fill="var(--color-primary, #7C6DF6)"/>
  </g>

  <!-- Network graph card -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="544" y="114" width="350" height="320" rx="16" fill="var(--color-neutral, #9ca3af)" opacity="0.3" transform="rotate(1.2 719 274)"/>
    <rect x="540" y="110" width="350" height="320" rx="16" fill="var(--color-base-100, #ffffff)" stroke="var(--color-base-content, #1f2937)" stroke-width="4"/>
    <text x="566" y="148" font-family="Excalifont, sans-serif" font-size="20" font-weight="bold" fill="var(--color-base-content, #1f2937)">Network</text>
    <path d="M566 164 h298" stroke="var(--color-base-content, #1f2937)" stroke-width="2.5" opacity="0.25" stroke-dasharray="4 4"/>

    <!-- Outer ring links -->
    <path d="M610 232 L715 206 L820 232 L830 330 L715 384 L600 340 Z" fill="none" stroke="var(--color-base-content, #1f2937)" stroke-width="2" opacity="0.2" stroke-dasharray="3 5"/>
    <!-- Spokes -->
    <path d="M715 290 L610 232 M715 290 L715 206 M715 290 L820 232 M715 290 L830 330 M715 290 L715 384 M715 290 L600 340" stroke="var(--color-primary, #7C6DF6)" stroke-width="2.5" opacity="0.6" stroke-dasharray="6 5" fill="none"/>

    <!-- Satellites -->
    <g transform="translate(610 232)"><circle r="21" fill="var(--color-secondary, #ec4899)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-secondary, #ec4899)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>
    <g transform="translate(715 206)"><circle r="21" fill="var(--color-accent, #14b8a6)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-accent, #14b8a6)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>
    <g transform="translate(820 232)"><circle r="21" fill="var(--color-success, #22c55e)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-success, #22c55e)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>
    <g transform="translate(830 330)"><circle r="21" fill="var(--color-warning, #f59e0b)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-warning, #f59e0b)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>
    <g transform="translate(715 384)"><circle r="21" fill="var(--color-info, #3b82f6)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-info, #3b82f6)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>
    <g transform="translate(600 340)"><circle r="21" fill="var(--color-error, #ef4444)" opacity="0.25"/><circle r="21" fill="none" stroke="var(--color-error, #ef4444)" stroke-width="2.5"/><circle cy="-4" r="6" fill="var(--color-base-content, #1f2937)"/><path d="M-11 11 c1-7 5-10 11-10 s10 3 11 10" fill="var(--color-base-content, #1f2937)"/></g>

    <!-- Center node -->
    <circle cx="715" cy="290" r="42" fill="var(--color-primary, #7C6DF6)" opacity="0.2"/>
    <circle cx="715" cy="290" r="42" fill="none" stroke="var(--color-primary, #7C6DF6)" stroke-width="3.5"/>
    <text x="715" y="288" font-family="Excalifont, sans-serif" font-size="13" font-weight="bold" fill="var(--color-base-content, #1f2937)" text-anchor="middle">Sapien</text>
    <text x="715" y="305" font-family="Excalifont, sans-serif" font-size="13" font-weight="bold" fill="var(--color-base-content, #1f2937)" text-anchor="middle">Society</text>
