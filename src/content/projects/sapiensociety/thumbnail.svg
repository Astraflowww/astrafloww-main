  <!-- Stack tags -->
  <g stroke-linecap="round" stroke-linejoin="round" font-family="Excalifont, sans-serif" font-size="14" text-anchor="middle">
    <rect x="301" y="472" width="90" height="28" rx="8" fill="var(--color-primary, #7C6DF6)" opacity="0.15"/>
    <rect x="301" y="472" width="90" height="28" rx="8" fill="none" stroke="var(--color-primary, #7C6DF6)" stroke-width="2"/>
    <text x="346" y="491" fill="var(--color-primary, #7C6DF6)">Next.js</text>
    <rect x="405" y="472" width="110" height="28" rx="8" fill="var(--color-secondary, #ec4899)" opacity="0.15"/>
    <rect x="405" y="472" width="110" height="28" rx="8" fill="none" stroke="var(--color-secondary, #ec4899)" stroke-width="2"/>
    <text x="460" y="491" fill="var(--color-secondary, #ec4899)">TypeScript</text>
    <rect x="529" y="472" width="130" height="28" rx="8" fill="var(--color-success, #22c55e)" opacity="0.15"/>
    <rect x="529" y="472" width="130" height="28" rx="8" fill="none" stroke="var(--color-success, #22c55e)" stroke-width="2"/>
    <text x="594" y="491" fill="var(--color-success, #22c55e)">Frontend only</text>
  </g>
</svg>